name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: ryugi-artifacts version to release; defaults to the one on ryugi-cloud main
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  models: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CLOUD_REPO: ryugi-dev/ryugi-cloud

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ryugi
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CLOUD_REPO }}
          ref: main
          token: ${{ secrets.RYUGI_CLOUD_TOKEN }}
          persist-credentials: false
          path: ryugi-cloud
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve the version
        id: release
        working-directory: ryugi-cloud
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-$(jq -r '.version' packages/artifacts/package.json)}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$version is not a semver version"
            exit 1
          fi
          tag="artifacts-v$version"
          if ! git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "::error::$CLOUD_REPO has no tag $tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if npm view "ryugi-artifacts@$version" version > /dev/null 2>&1; then
            echo "ryugi-artifacts@$version is already on npm."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the release tag
        working-directory: ryugi-cloud
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: git checkout -q --detach "$TAG"

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - working-directory: ryugi-cloud
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile

      - name: Read the plugin revision the suite pins as a fixture
        id: fixture
        if: steps.release.outputs.publish == 'true'
        working-directory: ryugi-cloud
        run: |
          revision="$(cat packages/artifacts/test/plugin-revision)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.release.outputs.publish == 'true'
        with:
          ref: ${{ steps.fixture.outputs.revision }}
          path: ryugi-plugin

      - name: Lint and typecheck
        if: steps.release.outputs.publish == 'true'
        working-directory: ryugi-cloud
        timeout-minutes: 8
        run: |
          pnpm lint
          pnpm --dir packages/shared typecheck
          pnpm --dir packages/artifacts typecheck

      - name: Test
        if: steps.release.outputs.publish == 'true'
        working-directory: ryugi-cloud
        # The artifacts suite takes over 15 minutes on hosted runners.
        timeout-minutes: 35
        env:
          RYUGI_PLUGIN_DIR: ${{ github.workspace }}/ryugi-plugin
        run: |
          pnpm --dir packages/shared test
          pnpm --dir packages/artifacts test

      - name: Catch the plugin checkout up with main, which can move during the tests
        working-directory: ryugi
        run: git pull -q --ff-only origin "$GITHUB_REF_NAME"

      - name: Sync the generated launcher files into the plugin
        working-directory: ryugi-cloud/packages/artifacts
        env:
          RYUGI_PLUGIN_DIR: ${{ github.workspace }}/ryugi
          RYUGI_SYNC_PLUGIN: '1'
        run: pnpm run build:cli

      - name: Publish ryugi-artifacts to npm
        if: steps.release.outputs.publish == 'true'
        working-directory: ryugi-cloud/packages/artifacts
        timeout-minutes: 8
        env:
          # The package is built from a private repository; provenance would attest this one as its source.
          NPM_CONFIG_PROVENANCE: 'false'
        run: |
          npm install -g npm@^11.15.0
          npm publish

      - name: Bump the plugin
        id: bump
        working-directory: ryugi
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "v$VERSION is already tagged."
            exit 0
          fi
          pnpm install --frozen-lockfile
          scripts/bump-version.sh "$VERSION"
          jq -r '.files[].path' .version-bump.json | sort -u | while IFS= read -r file; do
            pnpm exec prettier --write --ignore-unknown "$file"
          done
          scripts/bump-version.sh --check
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || git commit --no-verify -m "chore: release $VERSION"
          git tag "v$VERSION"
          git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "v$VERSION"

      - name: Create GitHub Release
        working-directory: ryugi
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          # GitHub Models by default; set these repository variables and a
          # RELEASE_NOTES_API_KEY secret to point at another OpenAI-compatible
          # endpoint (Anthropic, OpenAI, a gateway).
          RELEASE_NOTES_API_URL: ${{ vars.RELEASE_NOTES_API_URL || 'https://models.github.ai/inference/chat/completions' }}
          RELEASE_NOTES_API_KEY: ${{ secrets.RELEASE_NOTES_API_KEY || github.token }}
          RELEASE_NOTES_MODEL: ${{ vars.RELEASE_NOTES_MODEL || 'openai/gpt-4.1' }}
        run: |
          node scripts/release-notes.mjs --tag "v$VERSION" --ai > /tmp/release-notes.md
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release edit "v$VERSION" --notes-file /tmp/release-notes.md
          else
            gh release create "v$VERSION" --verify-tag --notes-file /tmp/release-notes.md
          fi

  daemon:
    needs: release
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CLOUD_REPO }}
          ref: ${{ needs.release.outputs.tag }}
          token: ${{ secrets.RYUGI_CLOUD_TOKEN }}
          persist-credentials: false

      - name: Add both Mac targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build ryugi-daemon for both architectures
        run: scripts/build-daemon.sh daemon-dist

      - name: Attach the binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: gh release upload "v$VERSION" daemon-dist/* --clobber -R "$GITHUB_REPOSITORY"
