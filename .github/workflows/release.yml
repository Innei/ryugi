name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish-viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: artifacts/pnpm-lock.yaml

      - name: Tag matches every declared version
        run: |
          version="$(jq -r '.version' package.json)"
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match artifacts/package.json version $version"
            exit 1
          fi
          ../scripts/bump-version.sh --check

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:viewer

      - name: Publish to npm
        run: |
          version="$(jq -r '.version' package.json)"
          if npm view "ryugi-artifacts@$version" version >/dev/null 2>&1; then
            echo "ryugi-artifacts@$version is already on npm; skipping publish."
            exit 0
          fi
          npm install -g npm@^11.15.0
          npm publish

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
