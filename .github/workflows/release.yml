name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish-viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: artifacts/pnpm-lock.yaml

      - name: Tag matches every declared version
        run: |
          version="$(jq -r '.version' package.json)"
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match artifacts/package.json version $version"
            exit 1
          fi
          ../scripts/bump-version.sh --check

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Install FFmpeg for recording tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm test
      - run: pnpm build

      - name: Publish to npm
        run: |
          version="$(jq -r '.version' package.json)"
          if npm view "ryugi-artifacts@$version" version >/dev/null 2>&1; then
            echo "ryugi-artifacts@$version is already on npm; skipping publish."
            exit 0
          fi
          npm install -g npm@^11.15.0
          echo "npm $(npm --version)"
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            echo "::error::no OIDC token available to this job; it needs permissions: id-token: write"
            exit 1
          fi
          id_token="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value')"
          status="$(curl -sS -o "$RUNNER_TEMP/exchange.json" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $id_token" \
            https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/ryugi-artifacts)"
          echo "Trusted publishing exchange: HTTP $status"
          if [[ "$status" != 2* ]]; then
            cat "$RUNNER_TEMP/exchange.json"
            echo "::error::npm refused the trusted publishing exchange; check the trusted publisher settings for ryugi-artifacts"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/exchange.json"
          npm publish

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
