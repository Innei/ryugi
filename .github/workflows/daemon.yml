name: Daemon

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Release whose ryugi-daemon to rebuild, sign and replace, e.g. 1.102.2
        required: true
        type: string

permissions:
  contents: write

env:
  CLOUD_REPO: ryugi-dev/ryugi-cloud
  ASSET: ryugi-daemon-darwin-arm64

jobs:
  daemon:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CLOUD_REPO }}
          ref: artifacts-v${{ inputs.version }}
          token: ${{ secrets.RYUGI_CLOUD_TOKEN }}
          persist-credentials: false

      - name: Add the Apple silicon target
        run: rustup target add aarch64-apple-darwin

      - name: Build ryugi-daemon for Apple silicon
        run: scripts/build-daemon.sh daemon-dist

      - name: Import the Developer ID certificate into a throwaway keychain
        id: keychain
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          read -ra existing <<< "$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm "$RUNNER_TEMP/certificate.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "$identity" ]]; then
            echo "::error::the certificate holds no Developer ID Application identity"
            exit 1
          fi
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Sign ryugi-daemon with the hardened runtime
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
          IDENTITY: ${{ steps.keychain.outputs.identity }}
        run: |
          codesign --force --timestamp --options runtime --identifier dev.ryugi.daemon \
            --keychain "$KEYCHAIN" --sign "$IDENTITY" "daemon-dist/$ASSET"
          codesign --verify --strict --verbose=2 "daemon-dist/$ASSET"
          codesign --display --verbose=2 "daemon-dist/$ASSET"

      - name: Notarize ryugi-daemon
        env:
          NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.NOTARY_PRIVATE_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_PRIVATE_KEY_BASE64" | base64 --decode > "$key"
          ditto -c -k "daemon-dist/$ASSET" "$RUNNER_TEMP/$ASSET.zip"
          xcrun notarytool submit "$RUNNER_TEMP/$ASSET.zip" --key "$key" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"
          status="$(jq -r '.status' "$RUNNER_TEMP/notary.json")"
          if [[ "$status" != "Accepted" ]]; then
            xcrun notarytool log "$(jq -r '.id' "$RUNNER_TEMP/notary.json")" --key "$key" \
              --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" || true
            echo "::error::notarization ended $status"
            exit 1
          fi
          rm "$key"

      - name: Checksum the signed binary
        working-directory: daemon-dist
        run: |
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
          cat "$ASSET.sha256"

      - name: Attach the binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release upload "v$VERSION" "daemon-dist/$ASSET" "daemon-dist/$ASSET.sha256" --clobber -R "$GITHUB_REPOSITORY"

      - name: Remove the keychain
        if: always() && steps.keychain.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN"

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: ryugi-daemon-linux-x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: ryugi-daemon-linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CLOUD_REPO }}
          ref: artifacts-v${{ inputs.version }}
          token: ${{ secrets.RYUGI_CLOUD_TOKEN }}
          persist-credentials: false

      - name: Install rustup when the runner has none
        run: |
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Add the musl target
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add ${{ matrix.target }}

      - name: Build ryugi-daemon for ${{ matrix.target }}
        run: scripts/build-daemon.sh daemon-dist ${{ matrix.target }}

      - name: Check it is a static binary
        run: file "daemon-dist/${{ matrix.asset }}" | tee /dev/stderr | grep -Eq 'statically linked|static-pie linked'

      - name: Attach the binary to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          ASSET: ${{ matrix.asset }}
        run: gh release upload "v$VERSION" "daemon-dist/$ASSET" "daemon-dist/$ASSET.sha256" --clobber -R "$GITHUB_REPOSITORY"
