name: Daemon

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      upload:
        description: Attach the binaries to the v<version> release instead of keeping them as workflow artifacts
        required: true
        type: boolean
      reuse:
        description: Take the binaries from an earlier release built from the same daemon source
        required: false
        default: true
        type: boolean
    outputs:
      source:
        value: ${{ jobs.plan.outputs.source }}
  workflow_dispatch:
    inputs:
      version:
        description: Release whose ryugi-daemon to rebuild, sign and replace, e.g. 1.102.2
        required: true
        type: string
      upload:
        description: Attach the binaries to the v<version> release
        required: false
        default: true
        type: boolean
      reuse:
        description: Take the binaries from an earlier release built from the same daemon source instead of building
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  CLOUD_REPO: ryugi-dev/ryugi-cloud
  UPLOAD: ${{ inputs.upload }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.plan.outputs.source }}
      from: ${{ steps.plan.outputs.from }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CLOUD_REPO }}
          ref: artifacts-v${{ inputs.version }}
          token: ${{ secrets.RYUGI_CLOUD_TOKEN }}
          persist-credentials: false

      - name: Fingerprint the daemon source and look for a release already built from it
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REUSE: ${{ inputs.reuse }}
        run: |
          [[ -x scripts/daemon-source.sh ]] || exit 0
          source="$(scripts/daemon-source.sh)"
          expected="$(jq -r '.daemonSource // ""' packages/artifacts/package.json)"
          if [[ -n "$expected" && "$expected" != "$source" ]]; then
            echo "::error::package.json expects daemon source $expected but artifacts-v$VERSION fingerprints as $source"
            exit 1
          fi
          echo "source=$source" >> "$GITHUB_OUTPUT"
          [[ "$REUSE" == true ]] || exit 0
          for tag in $(gh release list -R "$GITHUB_REPOSITORY" -L 15 --exclude-drafts --json tagName --jq '.[].tagName'); do
            [[ "$tag" != "v$VERSION" ]] || continue
            [[ "$(gh release download "$tag" -R "$GITHUB_REPOSITORY" -p ryugi-daemon.source -O - 2> /dev/null)" == "$source" ]] || continue
            count="$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name | select(startswith("ryugi-daemon-"))] | length')"
            if [[ "$count" -eq 10 ]]; then
              echo "::notice::daemon source $source is unchanged since $tag; reusing its binaries"
              echo "from=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

  reuse:
    needs: plan
    if: needs.plan.outputs.from != ''
    strategy:
      matrix:
        asset:
          - ryugi-daemon-darwin-arm64
          - ryugi-daemon-darwin-x64
          - ryugi-daemon-linux-x64
          - ryugi-daemon-linux-arm64
          - ryugi-daemon-win32-x64.exe
    runs-on: ubuntu-latest
    steps:
      - name: Take the binary from ${{ needs.plan.outputs.from }}
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ needs.plan.outputs.from }}
          ASSET: ${{ matrix.asset }}
        run: |
          gh release download "$FROM" -R "$GITHUB_REPOSITORY" -p "$ASSET" -p "$ASSET.sha256" -D daemon-dist
          (cd daemon-dist && sha256sum -c "$ASSET.sha256")

      - name: Attach the binary to the release
        if: env.UPLOAD == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          ASSET: ${{ matrix.asset }}
        run: gh release upload "v$VERSION" "daemon-dist/$ASSET" "daemon-dist/$ASSET.sha256" --clobber -R "$GITHUB_REPOSITORY"

      - name: Keep the binary for the release upload
        if: env.UPLOAD != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: daemon-dist/${{ matrix.asset }}*
          retention-days: 3

  mark:
    needs: [plan, reuse, daemon, linux, windows]
    if: always() && inputs.upload && needs.plan.outputs.source != '' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Record the daemon source the release's binaries were built from
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE: ${{ needs.plan.outputs.source }}
        run: |
          echo "$SOURCE" > ryugi-daemon.source
          gh release upload "v$VERSION" ryugi-daemon.source --clobber -R "$GITHUB_REPOSITORY"

  daemon:
    needs: plan
    if: needs.plan.outputs.from == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset: ryugi-daemon-darwin-arm64
          - target: x86_64-apple-darwin
            asset: ryugi-daemon-darwin-x64
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CLOUD_REPO }}
          ref: artifacts-v${{ inputs.version }}
          token: ${{ secrets.RYUGI_CLOUD_TOKEN }}
          persist-credentials: false

      - name: Install Zig for libghostty-vt
        # The official 0.15.2 build cannot link against the macOS 26+ SDK; Homebrew's is patched for it.
        run: |
          brew install zig@0.15
          echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"

      - name: Add the ${{ matrix.target }} target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon -> target
          key: ${{ matrix.target }}

      - name: Build ryugi-daemon for ${{ matrix.target }}
        run: scripts/build-daemon.sh daemon-dist ${{ matrix.target }}

      - name: Import the Developer ID certificate into a throwaway keychain
        id: keychain
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          read -ra existing <<< "$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm "$RUNNER_TEMP/certificate.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "$identity" ]]; then
            echo "::error::the certificate holds no Developer ID Application identity"
            exit 1
          fi
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Sign ryugi-daemon with the hardened runtime
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
          IDENTITY: ${{ steps.keychain.outputs.identity }}
        run: |
          codesign --force --timestamp --options runtime --identifier dev.ryugi.daemon \
            --keychain "$KEYCHAIN" --sign "$IDENTITY" "daemon-dist/$ASSET"
          codesign --verify --strict --verbose=2 "daemon-dist/$ASSET"
          codesign --display --verbose=2 "daemon-dist/$ASSET"

      - name: Notarize ryugi-daemon
        env:
          NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.NOTARY_PRIVATE_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_PRIVATE_KEY_BASE64" | base64 --decode > "$key"
          ditto -c -k "daemon-dist/$ASSET" "$RUNNER_TEMP/$ASSET.zip"
          xcrun notarytool submit "$RUNNER_TEMP/$ASSET.zip" --key "$key" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"
          status="$(jq -r '.status' "$RUNNER_TEMP/notary.json")"
          if [[ "$status" != "Accepted" ]]; then
            xcrun notarytool log "$(jq -r '.id' "$RUNNER_TEMP/notary.json")" --key "$key" \
              --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" || true
            echo "::error::notarization ended $status"
            exit 1
          fi
          rm "$key"

      - name: Checksum the signed binary
        working-directory: daemon-dist
        run: |
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
          cat "$ASSET.sha256"

      - name: Attach the binaries to the release
        if: env.UPLOAD == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release upload "v$VERSION" "daemon-dist/$ASSET" "daemon-dist/$ASSET.sha256" --clobber -R "$GITHUB_REPOSITORY"

      - name: Keep the binary for the release upload
        if: env.UPLOAD != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: daemon-dist/${{ env.ASSET }}*
          retention-days: 3

      - name: Remove the keychain
        if: always() && steps.keychain.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN"

  linux:
    needs: plan
    if: needs.plan.outputs.from == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: ryugi-daemon-linux-x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: ryugi-daemon-linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CLOUD_REPO }}
          ref: artifacts-v${{ inputs.version }}
          token: ${{ secrets.RYUGI_CLOUD_TOKEN }}
          persist-credentials: false

      - name: Install rustup when the runner has none
        run: |
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Install Zig for libghostty-vt
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Add the musl target
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon -> target
          key: ${{ matrix.target }}

      - name: Build ryugi-daemon for ${{ matrix.target }}
        run: scripts/build-daemon.sh daemon-dist ${{ matrix.target }}

      - name: Check it is a static binary
        run: file "daemon-dist/${{ matrix.asset }}" | tee /dev/stderr | grep -Eq 'statically linked|static-pie linked'

      - name: Attach the binary to the release
        if: env.UPLOAD == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          ASSET: ${{ matrix.asset }}
        run: gh release upload "v$VERSION" "daemon-dist/$ASSET" "daemon-dist/$ASSET.sha256" --clobber -R "$GITHUB_REPOSITORY"

      - name: Keep the binary for the release upload
        if: env.UPLOAD != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: daemon-dist/${{ matrix.asset }}*
          retention-days: 3

  windows:
    needs: plan
    if: needs.plan.outputs.from == ''
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ASSET: ryugi-daemon-win32-x64.exe
    defaults:
      run:
        shell: bash
    steps:
      # Bash would read the CRLF line endings Windows checkouts get by default as part of each command.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CLOUD_REPO }}
          ref: artifacts-v${{ inputs.version }}
          token: ${{ secrets.RYUGI_CLOUD_TOKEN }}
          persist-credentials: false

      - name: Add the MSVC target
        run: rustup target add x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon -> target

      - name: Build ryugi-daemon for Windows
        run: scripts/build-daemon.sh daemon-dist x86_64-pc-windows-msvc

      - name: Check it reports the release version
        env:
          VERSION: ${{ inputs.version }}
        # Git Bash on the Windows runner has no /dev/stderr to tee into.
        run: |
          reported="$("daemon-dist/$ASSET" --version)"
          echo "$reported"
          grep -q "^ryugi-daemon $VERSION " <<< "$reported"

      - name: Attach the binary to the release
        if: env.UPLOAD == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release upload "v$VERSION" "daemon-dist/$ASSET" "daemon-dist/$ASSET.sha256" --clobber -R "$GITHUB_REPOSITORY"

      - name: Keep the binary for the release upload
        if: env.UPLOAD != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: daemon-dist/${{ env.ASSET }}*
          retention-days: 3
