name: Release detect-agent

on:
  push:
    tags: ['detect-agent-v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/detect-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Tag matches the package version
        run: |
          version="$(jq -r '.version' package.json)"
          if [[ "detect-agent-v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packages/detect-agent/package.json version $version"
            exit 1
          fi

      - run: npm test

      - name: Publish to npm
        run: |
          version="$(jq -r '.version' package.json)"
          if npm view "ryugi-detect-agent@$version" version >/dev/null 2>&1; then
            echo "ryugi-detect-agent@$version is already on npm; skipping publish."
            exit 0
          fi
          npm install -g npm@^11.15.0
          echo "npm $(npm --version)"
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            echo "::error::no OIDC token available to this job; it needs permissions: id-token: write"
            exit 1
          fi
          id_token="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value')"
          status="$(curl -sS -o "$RUNNER_TEMP/exchange.json" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $id_token" \
            https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/ryugi-detect-agent)"
          echo "Trusted publishing exchange: HTTP $status"
          if [[ "$status" != 2* ]]; then
            cat "$RUNNER_TEMP/exchange.json"
            echo "::error::npm refused the trusted publishing exchange; check the trusted publisher settings for ryugi-detect-agent"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/exchange.json"
          npm publish --access public

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "ryugi-detect-agent ${GITHUB_REF_NAME#detect-agent-v}"
        env:
          GH_TOKEN: ${{ github.token }}
