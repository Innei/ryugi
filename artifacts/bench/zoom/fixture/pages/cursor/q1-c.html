<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=720">
<title>C · 呼吸光晕</title>
<link rel="stylesheet" href="./kit.css">
</head>
<body>
<div class="board">
  <div class="specbar"><span class="tag">C</span><span class="vals">28px · 实心 + 外发光 2.6s</span><span class="right">Q1 · AI 光效</span></div>
  <div class="stage">
    <section class="paper">
      <p class="caption">正文 · 14px / 1.75</p>
      <h3>谁在写这一段</h3>
      <p class="body">文档编辑时，光标停在哪一段，就说明 agent 正在改哪一段；名字写在箭头的胶囊里，不用猜。</p>
      <p class="body">移动时后面拖三个渐隐的点，停下就收起；箭头跟着画板缩放，不跟着正文滚动。</p>
      <p class="body">停下超过两秒，尾巴和光效都收起来，只留箭头和名字；下一次写入再亮起。</p>
      <p class="body">名字来自 agent 的署名，改一次就跟着改，不在客户端写死。</p>
      <div class="cur-slot situ" data-cursor='{"size":28,"style":"solid","shine":"halo"}'></div>
    </section>
    <aside class="detail">
      <div class="zoombox">
        <p class="caption">细节 · 2.5×</p>
        <div class="zoom"><div class="cur-slot" data-cursor='{"size":28,"style":"solid","shine":"halo"}'></div></div>
      </div>
      <dl class="spec">
        <dt>箭头</dt><dd>28px · 品牌色实心</dd>
        <dt>光效</dt><dd>品牌色径向光晕 · 呼吸</dd>
        <dt>范围</dt><dd>2.4 × 箭头 · 不遮字</dd>
        <dt>节奏</dt><dd>2.6s 缩放 .86 → 1.14</dd>
      </dl>
    </aside>
  </div>
</div>
<script src="./kit.js"></script>
</body>
</html>
