<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=720">
<title>D · 文字高光</title>
<link rel="stylesheet" href="./kit.css">
</head>
<body>
<div class="board">
  <div class="specbar"><span class="tag">D</span><span class="vals">28px · 文字高光 3.2s</span><span class="right">Q4 · label 光效</span></div>
  <div class="stage">
    <section class="paper">
      <p class="caption">正文 · 14px / 1.75</p>
      <h3>谁在写这一段</h3>
      <p class="body">文档编辑时，光标停在哪一段，就说明 agent 正在改哪一段；名字写在箭头的胶囊里，不用猜。</p>
      <p class="body">移动时后面拖三个渐隐的点，停下就收起；箭头跟着画板缩放，不跟着正文滚动。</p>
      <p class="body">停下超过两秒，尾巴和光效都收起来，只留箭头和名字；下一次写入再亮起。</p>
      <p class="body">名字来自 agent 的署名，改一次就跟着改，不在客户端写死。</p>
      <div class="cur-slot situ" data-cursor='{"size":28,"style":"solid","labelShine":"text"}'></div>
    </section>
    <aside class="detail">
      <div class="zoombox">
        <p class="caption">细节 · 2.5×</p>
        <div class="zoom"><div class="cur-slot" data-cursor='{"size":28,"style":"solid","labelShine":"text"}'></div></div>
      </div>
      <dl class="spec">
        <dt>高光</dt><dd>暖白字 #ffd9c6 · 纯白掠过</dd>
        <dt>范围</dt><dd>只影响名字，胶囊不变</dd>
        <dt>节奏</dt><dd>3.2s 往返，幅度很小</dd>
        <dt>取舍</dt><dd>1× 下几乎看不见，最不打扰</dd>
      </dl>
    </aside>
  </div>
</div>
<script src="./kit.js"></script>
</body>
</html>
