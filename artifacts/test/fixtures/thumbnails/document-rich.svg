<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360"><title>协作文档 &lt;测试&gt;</title><style>:root{--ink:#333;--muted:#85817c;--paper:#fff;--bg:#f3f2f0;--border:#dedcd7;--block:#f2f1ee;--alert:#f7eee4}@media (prefers-color-scheme: dark){:root{--ink:#e5e5e5;--muted:#a0a0a0;--paper:#292929;--bg:#1c1c1c;--border:#424242;--block:#353535;--alert:#3b342e}}text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif}rect{stroke-width:.8;vector-effect:non-scaling-stroke}</style><rect x="0" y="0" width="600" height="360" fill="var(--bg)" stroke="none"/><rect x="78" y="18" width="444" height="540" fill="var(--paper)" stroke="var(--border)"/><text x="104" y="47" font-size="18" fill="var(--ink)" font-weight="650">协作文档 &lt;测试&gt; heading</text><text x="104" y="82" font-size="9" fill="var(--ink)" font-weight="400">第一段正文，包含 加粗 和 code，长度足够长以便换行。The quick brown fox jumps over t</text><text x="104" y="95.5" font-size="9" fill="var(--ink)" font-weight="400">he lazy dog again and again until the line wraps twice or more.</text><text x="104" y="124" font-size="11.5" fill="var(--ink)" font-weight="650">二级标题</text><rect x="104" y="141.25" width="130.66666666666666" height="22" fill="var(--block)" stroke="var(--border)"/><text x="109" y="155.25" font-size="7.5" fill="var(--ink)" font-weight="400">名称</text><rect x="234.66666666666666" y="141.25" width="130.66666666666666" height="22" fill="var(--block)" stroke="var(--border)"/><text x="239.66666666666666" y="155.25" font-size="7.5" fill="var(--ink)" font-weight="400">说明</text><rect x="365.3333333333333" y="141.25" width="130.66666666666666" height="22" fill="var(--block)" stroke="var(--border)"/><text x="370.3333333333333" y="155.25" font-size="7.5" fill="var(--ink)" font-weight="400">状态</text><rect x="104" y="163.25" width="130.66666666666666" height="22" fill="var(--paper)" stroke="var(--border)"/><text x="109" y="177.25" font-size="7.5" fill="var(--ink)" font-weight="400">Thumbnail</text><rect x="234.66666666666666" y="163.25" width="130.66666666666666" height="22" fill="var(--paper)" stroke="var(--border)"/><text x="239.66666666666666" y="177.25" font-size="7.5" fill="var(--ink)" font-weight="400">共享缩略图 &amp; 占位</text><rect x="365.3333333333333" y="163.25" width="130.66666666666666" height="22" fill="var(--paper)" stroke="var(--border)"/><text x="370.3333333333333" y="177.25" font-size="7.5" fill="var(--ink)" font-weight="400">进行中</text><rect x="104" y="185.25" width="130.66666666666666" height="22" fill="var(--paper)" stroke="var(--border)"/><text x="109" y="199.25" font-size="7.5" fill="var(--ink)" font-weight="400">Tiers</text><rect x="234.66666666666666" y="185.25" width="130.66666666666666" height="22" fill="var(--paper)" stroke="var(--border)"/><text x="239.66666666666666" y="199.25" font-size="7.5" fill="var(--ink)" font-weight="400">画板分档</text><rect x="365.3333333333333" y="185.25" width="130.66666666666666" height="22" fill="var(--paper)" stroke="var(--border)"/><text x="370.3333333333333" y="199.25" font-size="7.5" fill="var(--ink)" font-weight="400">待开始</text><text x="104" y="225.25" font-size="9" fill="var(--ink)" font-weight="400">•</text><text x="117" y="225.25" font-size="9" fill="var(--ink)" font-weight="400">无序一</text><text x="104" y="238.75" font-size="9" fill="var(--ink)" font-weight="400">•</text><text x="117" y="238.75" font-size="9" fill="var(--ink)" font-weight="400">无序二</text><text x="104" y="260.25" font-size="9" fill="var(--ink)" font-weight="400">1.</text><text x="117" y="260.25" font-size="9" fill="var(--ink)" font-weight="400">有序一</text><text x="104" y="273.75" font-size="9" fill="var(--ink)" font-weight="400">2.</text><text x="117" y="273.75" font-size="9" fill="var(--ink)" font-weight="400">有序二</text><text x="104" y="287.25" font-size="9" fill="var(--ink)" font-weight="400">3.</text><text x="117" y="287.25" font-size="9" fill="var(--ink)" font-weight="400">有序三</text><rect x="104" y="300.75" width="392" height="30" fill="var(--alert)" stroke="none"/><rect x="104" y="300.75" width="2" height="30" fill="#c3986d" stroke="none"/><text x="116" y="315.75" font-size="9" fill="var(--ink)" font-weight="400">Offline over 7 days falls back to snapshots.</text></svg>