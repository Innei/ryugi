<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360"><title>Plain &amp; simple</title><style>:root{--ink:#333;--muted:#85817c;--paper:#fff;--bg:#f3f2f0;--border:#dedcd7;--block:#f2f1ee;--alert:#f7eee4}@media (prefers-color-scheme: dark){:root{--ink:#e5e5e5;--muted:#a0a0a0;--paper:#292929;--bg:#1c1c1c;--border:#424242;--block:#353535;--alert:#3b342e}}text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif}rect{stroke-width:.8;vector-effect:non-scaling-stroke}</style><rect x="0" y="0" width="600" height="360" fill="var(--bg)" stroke="none"/><rect x="78" y="18" width="444" height="540" fill="var(--paper)" stroke="var(--border)"/><text x="104" y="47" font-size="18" fill="var(--ink)" font-weight="650">Plain &amp; simple</text><text x="104" y="81" font-size="9" fill="var(--ink)" font-weight="400">没有标题的文档，第一块就是段落。</text><text x="104" y="101.5" font-size="9" fill="var(--ink)" font-weight="400">第二段。</text></svg>