<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="ryugi-ui" content="1">
<title>API latency explorer — p50 / p95 across 24 endpoints</title>
<style>
  :root { --slow: #e5484d; --slow-bg: rgba(229,72,77,.09); --muted: rgba(127,127,127,.75); --line: rgba(127,127,127,.18); }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; font: 14px/1.45 system-ui, -apple-system, sans-serif; max-width: 1080px; margin-inline: auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .controls { display: grid; grid-template-columns: 1.4fr auto; gap: 16px 20px; align-items: end; margin-bottom: 16px; }
  .field { display: grid; gap: 6px; }
  .field label { font-size: 12px; color: var(--muted); font-weight: 500; }
  .row2 { display: grid; grid-template-columns: 1.4fr 1fr auto; gap: 20px; align-items: end; margin-bottom: 20px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .v.slow { color: var(--slow); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; color: var(--muted); font-weight: 500; }
  th.num, td.num { text-align: right; }
  td.path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  tr.slow td { background: var(--slow-bg); }
  tr.slow td:first-child { box-shadow: inset 3px 0 0 var(--slow); }
  tr.slow .p95 { color: var(--slow); font-weight: 600; }
  .barcell { width: 32%; }
  .bar { position: relative; height: 14px; border-radius: 3px; background: var(--line); }
  .bar .b50, .bar .b95 { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
  .bar .b95 { background: rgba(100,130,255,.35); }
  .bar .b50 { background: rgba(100,130,255,.9); }
  tr.slow .bar .b95 { background: rgba(229,72,77,.4); }
  tr.slow .bar .b50 { background: rgba(229,72,77,.85); }
  .bar .th { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--slow); opacity: .7; }
  .legend { display: flex; gap: 16px; color: var(--muted); font-size: 12px; margin: 8px 0 0; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .empty { padding: 32px; text-align: center; color: var(--muted); }
  @media (max-width: 760px) { .row2, .controls { grid-template-columns: 1fr; } .stats { grid-template-columns: repeat(2,1fr); } .barcell { display: none; } }
</style>
</head>
<body>
  <h1>API latency explorer</h1>
  <p class="sub">p50 / p95 over the last 24h · 24 endpoints · sample data</p>

  <div class="row2">
    <div class="field">
      <label for="search">Search path</label>
      <ryugi-input id="search" allowClear placeholder="e.g. /orders or :id" aria-label="Search path"></ryugi-input>
    </div>
    <div class="field">
      <label>HTTP method</label>
      <ryugi-segmented id="method" value="ALL">
        <ryugi-segment value="ALL">All</ryugi-segment>
        <ryugi-segment value="GET">GET</ryugi-segment>
        <ryugi-segment value="POST">POST</ryugi-segment>
        <ryugi-segment value="PUT">PUT</ryugi-segment>
        <ryugi-segment value="PATCH">PATCH</ryugi-segment>
        <ryugi-segment value="DELETE">DELETE</ryugi-segment>
      </ryugi-segmented>
    </div>
    <div class="field">
      <label>Sort by p95</label>
      <ryugi-segmented id="sort" value="desc">
        <ryugi-segment value="desc">Slowest first</ryugi-segment>
        <ryugi-segment value="asc">Fastest first</ryugi-segment>
      </ryugi-segmented>
    </div>
  </div>

  <div class="controls">
    <div class="field">
      <label>Slow threshold — p95 above (ms)</label>
      <ryugi-slider-input id="threshold" value="400" min="50" max="2000" step="25"></ryugi-slider-input>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <ryugi-checkbox id="slowOnly">Show only slow</ryugi-checkbox>
    </div>
  </div>

  <div class="stats">
    <ryugi-card class="stat" variant="outlined"><div class="k">Showing</div><div class="v" id="sCount">–</div></ryugi-card>
    <ryugi-card class="stat" variant="outlined"><div class="k">Slow endpoints</div><div class="v slow" id="sSlow">–</div></ryugi-card>
    <ryugi-card class="stat" variant="outlined"><div class="k">Median p50</div><div class="v" id="sP50">–</div></ryugi-card>
    <ryugi-card class="stat" variant="outlined"><div class="k">Worst p95</div><div class="v" id="sP95">–</div></ryugi-card>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width:84px">Method</th>
        <th>Path</th>
        <th class="num">Req/min</th>
        <th class="num">p50</th>
        <th class="num">p95 ↕</th>
        <th class="barcell">Distribution</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="legend">
    <span><span class="sw" style="background:rgba(100,130,255,.9)"></span>p50</span>
    <span><span class="sw" style="background:rgba(100,130,255,.35)"></span>p95</span>
    <span><span class="sw" style="background:var(--slow)"></span>threshold</span>
  </div>

<script>
  const DATA = [
    ['GET',    '/v1/health',                       2,    4,  1820],
    ['GET',    '/v1/users/me',                    18,   46,   940],
    ['GET',    '/v1/users/:id',                   22,   61,   610],
    ['PATCH',  '/v1/users/:id',                   48,  132,    84],
    ['POST',   '/v1/auth/login',                 120,  310,   220],
    ['POST',   '/v1/auth/refresh',                26,   74,   760],
    ['POST',   '/v1/auth/logout',                 14,   38,    95],
    ['GET',    '/v1/products',                    64,  188,   830],
    ['GET',    '/v1/products/:id',                29,   82,  1240],
    ['GET',    '/v1/search',                     142,  612,   540],
    ['GET',    '/v1/cart',                        35,   97,   410],
    ['PUT',    '/v1/cart/items/:id',              58,  171,   190],
    ['DELETE', '/v1/cart/items/:id',              41,  118,    72],
    ['POST',   '/v1/orders',                     236,  842,   130],
    ['GET',    '/v1/orders',                      88,  295,   260],
    ['GET',    '/v1/orders/:id',                  44,  139,   310],
    ['POST',   '/v1/orders/:id/cancel',          174,  488,    11],
    ['POST',   '/v1/payments/charge',            412, 1380,   118],
    ['POST',   '/v1/payments/webhook',            67,  254,   145],
    ['GET',    '/v1/reports/sales',              690, 1920,     6],
    ['POST',   '/v1/uploads',                    310, 1145,    38],
    ['GET',    '/v1/notifications',               31,  102,   480],
    ['PUT',    '/v1/settings/preferences',        52,  149,    27],
    ['DELETE', '/v1/sessions/:id',                19,   57,    44],
  ].map(([method, path, p50, p95, rpm]) => ({ method, path, p50, p95, rpm }));

  const METHOD_COLOR = { GET: 'blue', POST: 'green', PUT: 'orange', PATCH: 'purple', DELETE: 'red' };
  const state = { search: '', method: 'ALL', sort: 'desc', threshold: 400, slowOnly: false };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = (ms) => ms >= 1000 ? (ms / 1000).toFixed(2) + ' s' : ms + ' ms';
  const median = (a) => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : Math.round((s[m - 1] + s[m]) / 2); };

  function render() {
    const q = state.search.trim().toLowerCase();
    const th = Number(state.threshold) || 0;
    let rows = DATA.filter((d) =>
      (state.method === 'ALL' || d.method === state.method) &&
      (!q || d.path.toLowerCase().includes(q)) &&
      (!state.slowOnly || d.p95 > th));
    rows.sort((a, b) => state.sort === 'asc' ? a.p95 - b.p95 : b.p95 - a.p95);

    const scale = Math.max(2000, th) * 1.02;
    const slowCount = rows.filter((d) => d.p95 > th).length;
    $('sCount').textContent = rows.length + ' / ' + DATA.length;
    $('sSlow').textContent = slowCount;
    $('sP50').textContent = rows.length ? fmt(median(rows.map((d) => d.p50))) : '–';
    $('sP95').textContent = rows.length ? fmt(Math.max(...rows.map((d) => d.p95))) : '–';

    $('rows').innerHTML = rows.length ? rows.map((d) => {
      const slow = d.p95 > th;
      return `<tr class="${slow ? 'slow' : ''}">
        <td><ryugi-tag size="small" color="${METHOD_COLOR[d.method]}">${d.method}</ryugi-tag></td>
        <td class="path">${esc(d.path)}</td>
        <td class="num">${d.rpm.toLocaleString()}</td>
        <td class="num">${fmt(d.p50)}</td>
        <td class="num p95">${fmt(d.p95)}</td>
        <td class="barcell"><div class="bar">
          <div class="b95" style="width:${(d.p95 / scale) * 100}%"></div>
          <div class="b50" style="width:${(d.p50 / scale) * 100}%"></div>
          <div class="th" style="left:${(th / scale) * 100}%"></div>
        </div></td>
      </tr>`;
    }).join('') : `<tr><td colspan="6" class="empty">No endpoints match these filters.</td></tr>`;
  }

  document.addEventListener('ryugi-change', (e) => {
    const id = e.target.id;
    if (!(id in state)) return;
    state[id] = id === 'slowOnly' ? !!e.detail.checked : (e.detail.value ?? '');
    render();
  });
  document.addEventListener('ryugi-ui:ready', () => {
    state.search = $('search').value || '';
    state.method = $('method').value || 'ALL';
    state.sort = $('sort').value || 'desc';
    state.threshold = Number($('threshold').value) || 400;
    state.slowOnly = !!$('slowOnly').checked;
    render();
  }, { once: true });
  render();
</script>
</body>
</html>
